name: Bot Buffet CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fail fast with an actionable report if the runner lacks a prerequisite,
      # instead of surfacing it later as an opaque failure inside a gate.
      - run: npm run preflight
      - run: npm run format:check
      - run: npm run typecheck
      # The GitHub runner has a working Docker daemon, so the container sandbox
      # integration suite is REQUIRED here. Without this the suite would skip
      # and its coverage would vanish silently.
      - run: npm test -- --coverage
        env:
          BOT_BUFFET_REQUIRE_DOCKER_TESTS: '1'
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run security:scan
      - run: npm run build
      - run: npm run smoke
      - run: npm run restore:drill
      - run: npm run provenance
      - run: npm run sbom
      - uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
        if: always()
        continue-on-error: true
        with: { sarif_file: results.sarif }
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --tag bot-buffet:${{ github.sha }} .
      - run: docker run --detach --name bot-buffet -p 8787:8787 bot-buffet:${{ github.sha }}
      - run: for i in {1..20}; do curl --fail http://127.0.0.1:8787/readyz && exit 0 || sleep 1; done; exit 1
      - if: always()
        run: docker logs bot-buffet
