name: Bot Buffet CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fail fast with an actionable report if the runner lacks a prerequisite,
      # instead of surfacing it later as an opaque failure inside a gate.
      - run: npm run preflight
      - run: npm run format:check
      - run: npm run typecheck
      # The GitHub runner has a working Docker daemon, so the container sandbox
      # integration suite is REQUIRED here. Without this the suite would skip
      # and its coverage would vanish silently.
      - run: npm test -- --coverage
        env:
          BOT_BUFFET_REQUIRE_DOCKER_TESTS: '1'
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run security:scan
      - run: npm run build
      - run: npm run smoke
      - run: npm run restore:drill
      - run: npm run provenance
      - run: npm run sbom
      - uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
        if: always()
        continue-on-error: true
        with: { sarif_file: results.sarif }
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --tag bot-buffet:${{ github.sha }} .
      # The image deliberately has no privileged Docker socket or daemon. The
      # control plane must receive a separately managed runner in staging and
      # production; without one it must fail closed before advertising ready.
      - name: Assert sandbox runner fail-closed startup
        shell: bash
        run: |
          set +e
          output="$(docker run --rm bot-buffet:${{ github.sha }} 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q "sandbox_runner_unavailable" <<< "$output"
