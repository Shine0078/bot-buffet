name: Bot Buffet CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run security:scan
      - run: npm run build
      - run: npm run sbom
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with: { sarif_file: results.sarif }
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag bot-buffet:${{ github.sha }} .
      - run: docker run --detach --name bot-buffet -p 8787:8787 bot-buffet:${{ github.sha }}
      - run: for i in {1..20}; do curl --fail http://127.0.0.1:8787/readyz && exit 0 || sleep 1; done; exit 1
      - if: always()
        run: docker logs bot-buffet
