name: Bot Buffet CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fail fast with an actionable report if the runner lacks a prerequisite,
      # instead of surfacing it later as an opaque failure inside a gate.
      - run: npm run preflight
      - run: npm run format:check
      - run: npm run typecheck
      # The GitHub runner has a working Docker daemon, so the container sandbox
      # integration suite is REQUIRED here. Without this the suite would skip
      # and its coverage would vanish silently.
      - run: npm test -- --coverage
        env:
          BOT_BUFFET_REQUIRE_DOCKER_TESTS: '1'
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run security:scan
      - run: npm run build
      - run: npm run smoke
      - run: npm run restore:drill
      - run: npm run provenance
      # A manifest nobody checks is not evidence. Verify it in the same run.
      - run: npm run provenance:verify
      - run: npm run sbom
      - uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
        if: always()
        continue-on-error: true
        with: { sarif_file: results.sarif }
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --tag bot-buffet:${{ github.sha }} .
      # Run under the same posture the sandbox evidence was gathered with. The
      # previous form started the container with no hardening at all, so CI
      # proved only that the image boots — a regression that dropped the
      # read-only root or ran as root would have passed unnoticed.
      - name: Start the container hardened
        run: |
          docker run --detach --name bot-buffet \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 512m --cpus 1 \
            --mount type=volume,source=bot-buffet-data,target=/data \
            -p 8787:8787 bot-buffet:${{ github.sha }}
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/readyz && exit 0
            sleep 1
          done
          echo "container never became ready"
          exit 1
      - name: Assert the hardening actually holds
        run: |
          set -euo pipefail
          # Non-root. `id -u` is the claim that matters; the image USER could be
          # overridden at any point without the Dockerfile changing.
          uid=$(docker exec bot-buffet id -u)
          test "$uid" != "0" || { echo "container is running as root"; exit 1; }
          echo "runs as uid $uid"

          # Read-only root filesystem: the write must fail.
          if docker exec bot-buffet sh -c 'touch /etc/ci-probe' 2>/dev/null; then
            echo "root filesystem is writable"; exit 1
          fi
          echo "root filesystem is read-only"

          # The data volume is the one place writes are allowed.
          docker exec bot-buffet sh -c 'touch /data/ci-probe && rm /data/ci-probe'
          echo "data volume is writable"
      - name: Assert the API answers and the audit chain verifies
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8787/healthz > /dev/null
          curl --fail --silent http://127.0.0.1:8787/metrics > /dev/null
          audit=$(curl --fail --silent -H 'x-bot-buffet-user: local-user' \
            http://127.0.0.1:8787/api/v1/audit/verify)
          echo "audit: $audit"
          case "$audit" in *'"valid":true'*) ;; *) echo "audit chain invalid"; exit 1;; esac
      - name: Assert state survives a restart
        run: |
          set -euo pipefail
          before=$(curl --fail --silent -H 'x-bot-buffet-user: local-user' \
            http://127.0.0.1:8787/api/v1/projects | grep -o '"kind":"project"' | wc -l)
          docker restart bot-buffet
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/readyz > /dev/null && break
            sleep 1
          done
          after=$(curl --fail --silent -H 'x-bot-buffet-user: local-user' \
            http://127.0.0.1:8787/api/v1/projects | grep -o '"kind":"project"' | wc -l)
          echo "projects before=$before after=$after"
          test "$before" = "$after" || { echo "state did not survive restart"; exit 1; }
      # Prove a bad release is detected and recoverable, not just that a good
      # one boots. Runs in the container job because it needs a daemon.
      - name: Rollback drill
        run: npm ci && npm run rollback:drill
        env:
          BOT_BUFFET_REQUIRE_DOCKER_TESTS: '1'
      - if: always()
        run: docker logs bot-buffet
