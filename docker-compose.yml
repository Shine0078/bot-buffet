services:
  bot-buffet:
    build: .
    ports: ['8787:8787']
    env_file: [.env]
    environment:
      BOT_BUFFET_DATA_DIR: /data
    volumes: ['bot-buffet-data:/data']
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
volumes:
  bot-buffet-data:
